events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zone (Nginx backup layer)
    limit_req_zone $binary_remote_addr zone=optilib_limit:10m rate=30r/s;

    # Upstream to OptiLib app container or local server
    upstream optilib_app {
        server optilib:5000; # Use 127.0.0.1:5000 if running directly on host
    }

    # 1. HTTP Server (Redirect all traffic to HTTPS)
    server {
        listen 80;
        server_name optilib.aittokallio.group;

        # ACME-challenge for Let's Encrypt / Certbot renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Server (TLS Termination)
    server {
        listen 443 ssl http2;
        server_name optilib.aittokallio.group;

        # SSL Certificates (Replace with your actual domain cert paths from Certbot)
        ssl_certificate /etc/letsencrypt/live/optilib.aittokallio.group/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/optilib.aittokallio.group/privkey.pem;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Maximum file upload size (supports multi-MB affinity and target files)
        client_max_body_size 50M;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Deploy the public webapp/static contents here (see DEPLOYMENT.md).
        location /static/ {
            alias /var/www/optilib/static/;
            expires 1h;
            access_log off;
        }

        location / {
            limit_req zone=optilib_limit burst=50 nodelay;

            proxy_pass http://optilib_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Extended timeouts for long-running selectivity matrix and optimization jobs
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;

            # APIs return complete JSON responses; buffering frees app threads sooner.
            proxy_buffering on;
        }

        # Health check endpoint for external monitoring
        location /health {
            proxy_pass http://optilib_app/health;
            access_log off;
        }
    }
}
