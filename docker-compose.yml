x-app: &app
  build: .
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=128m,mode=1777
  env_file:
    - path: .env
      required: true
  environment: &environment
    OPTILIB_ENV: production
    OPTILIB_RUNTIME: /app/runtime
    OPTILIB_DATABASE: /app/database
    SECRET_KEY: ${SECRET_KEY:?Set a strong SECRET_KEY in .env}
    SESSION_COOKIE_SECURE: "true"
    TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Set the public hostname in .env}
    OPTILIB_ACCEL_REDIRECT: "true"
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"
  volumes:
    - ./database:/app/database:ro
    - ${RUNTIME_HOST_PATH:-/var/lib/optilib/runtime}:/app/runtime

services:
  optilib:
    <<: *app
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - computation
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 64

  computation:
    <<: *app
    command: ["python", "-m", "webapp.public.worker"]
    mem_limit: 5g
    cpus: "3.0"
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-m", "webapp.public.check_worker"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  molport-updater:
    build: .
    profiles: [maintenance]
    restart: "no"
    user: "10001:10001"
    env_file: .env
    command: ["python", "scripts/update_molport_db.py"]
    volumes:
      - ./database:/app/database
    mem_limit: 4g
    cpus: "2.0"
    healthcheck:
      disable: true
