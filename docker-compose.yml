services:
  optilib:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optilib
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Mount the local database directory containing chembl_36.db and molport.db (~32GB)
      - ./database:/app/database
      # Persist generated outputs (Excel files, Pareto plots, etc.) on host
      - ./webapp/output:/app/webapp/output
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT:-120 per minute}
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
        reservations:
          memory: 2G

  molport-updater:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optilib_molport_updater
    restart: unless-stopped
    volumes:
      - ./database:/app/database
      - ./webapp/output:/app/webapp/output
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - MOLPORT_FTP_USER=${MOLPORT_FTP_USER:-}
      - MOLPORT_FTP_PASS=${MOLPORT_FTP_PASS:-}
      - MOLPORT_FTP_HOST=${MOLPORT_FTP_HOST:-ftp.molport.com}
      - MOLPORT_FTP_PORT=${MOLPORT_FTP_PORT:-21}
    # Sets up a monthly cron job (1st of every month at 03:00 AM UTC) and keeps cron running in foreground
    entrypoint: >
      bash -c '
      echo "Setting up MolPort automated monthly updater cron job...";
      echo "0 3 1 * * cd /app && python scripts/update_molport_db.py >> /app/webapp/output/molport_update.log 2>&1" > /etc/cron.d/molport-update;
      chmod 0644 /etc/cron.d/molport-update;
      crontab /etc/cron.d/molport-update;
      echo "Cron scheduler started. MolPort updates will run automatically on the 1st of each month at 03:00 AM UTC.";
      cron -f -L 15
      '
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
